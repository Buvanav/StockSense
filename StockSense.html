<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockSense</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#273449;--acc:#3b82f6;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--txt:#e2e8f0;--sub:#94a3b8;--bd:#334155;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100%}
html,body{height:100%}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit;background:#0b1220;border:1px solid var(--bd);color:var(--txt);border-radius:6px;padding:8px}
.btn{background:var(--acc);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:600}
.btn.gray{background:#334155}
.btn.red{background:var(--bad)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--sub);font-weight:600}
.badge{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.b-good{background:#14532d;color:#86efac}
.b-warn{background:#78350f;color:#fcd34d}
.b-bad{background:#7f1d1d;color:#fca5a5}
.b-gray{background:#334155;color:#cbd5e1}
.hidden{display:none!important}
#app{display:flex;min-height:100vh}
#sidebar{width:220px;background:var(--panel);border-right:1px solid var(--bd);padding:16px 10px;flex-shrink:0}
#sidebar h2{font-size:18px;padding:0 8px;margin:0 0 20px}
#sidebar a{display:block;color:var(--sub);text-decoration:none;padding:9px 10px;border-radius:6px;margin-bottom:2px;font-size:14px}
#sidebar a.active,#sidebar a:hover{background:var(--panel2);color:#fff}
#main{flex:1;padding:22px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi h3{margin:0;font-size:13px;color:var(--sub);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px}
h1{font-size:20px;margin:0 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.err{color:var(--bad);font-size:13px;margin-top:6px}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:3px}
.fld{margin-bottom:10px}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.authcard{width:340px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--bd);padding:12px 16px;border-radius:8px;z-index:99}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:var(--panel2);border:1px solid var(--bd);color:var(--sub);padding:6px 12px;border-radius:6px;font-size:13px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
::placeholder{color:#64748b}
</style>
</head>
<body>

<div id="login">
  <div class="card authcard">
    <h1>StockSense</h1>
    <div id="loginForm">
      <div class="fld"><label>Email</label><input id="liEmail" type="email" placeholder="you@company.com"></div>
      <div class="fld"><label>Password</label><input id="liPass" type="password" placeholder="••••••"></div>
      <div class="err" id="liErr"></div>
      <button class="btn" style="width:100%" onclick="doLogin()">Log In</button>
      <div style="margin-top:10px;font-size:13px;color:var(--sub)">
        <a href="#" onclick="showSignup();return false" style="color:var(--acc)">Sign up</a> ·
        <a href="#" onclick="showForgot();return false" style="color:var(--acc)">Forgot password</a>
      </div>
    </div>
    <div id="signupForm" class="hidden">
      <div class="fld"><label>Name</label><input id="suName"></div>
      <div class="fld"><label>Email</label><input id="suEmail" type="email"></div>
      <div class="fld"><label>Password</label><input id="suPass" type="password"></div>
      <div class="fld"><label>Confirm Password</label><input id="suConf" type="password"></div>
      <div class="err" id="suErr"></div>
      <button class="btn" style="width:100%" onclick="doSignup()">Create Account</button>
      <div style="margin-top:10px;font-size:13px"><a href="#" onclick="showLogin();return false" style="color:var(--acc)">Back to login</a></div>
    </div>
    <div id="forgotForm" class="hidden">
      <div id="fEmailStep">
        <div class="fld"><label>Email</label><input id="fEmail" type="email"></div>
        <button class="btn" style="width:100%" onclick="sendOtp()">Send OTP</button>
      </div>
      <div id="fOtpStep" class="hidden">
        <p style="font-size:13px;color:var(--sub)">Demo OTP (would be emailed in production): <b id="otpShow" style="color:#fff"></b></p>
        <div class="fld"><label>Enter OTP</label><input id="fOtp"></div>
        <button class="btn" style="width:100%" onclick="verifyOtp()">Verify</button>
      </div>
      <div id="fNewPassStep" class="hidden">
        <div class="fld"><label>New Password</label><input id="fNewPass" type="password"></div>
        <button class="btn" style="width:100%" onclick="resetPass()">Reset Password</button>
      </div>
      <div class="err" id="fErr"></div>
      <div style="margin-top:10px;font-size:13px"><a href="#" onclick="showLogin();return false" style="color:var(--acc)">Back to login</a></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <h2>📦 StockSense</h2>
    <a href="#" data-p="dashboard">Dashboard</a>
    <a href="#" data-p="products">Products</a>
    <a href="#" data-p="receipts">Receipts</a>
    <a href="#" data-p="deliveries">Deliveries</a>
    <a href="#" data-p="transfers">Internal Transfers</a>
    <a href="#" data-p="adjustments">Adjustments</a>
    <a href="#" data-p="ledger">Stock Ledger</a>
    <a href="#" data-p="settings">Settings</a>
    <a href="#" data-p="profile">Profile</a>
    <a href="#" onclick="logout();return false">Logout</a>
  </div>
  <div id="main"></div>
</div>
<div id="toastBox"></div>

<script>
// Checkpoint 4: DEFAULT_LOC is now only a one-time seed used to migrate a brand-new or
// pre-checkpoint-4 database into DB.warehouses below. Nothing else reads DEFAULT_LOC directly —
// live code always reads DB.warehouses so warehouses/locations become user-editable data.
const DEFAULT_LOC = {"Main Warehouse":["Rack A","Rack B"],"Production Warehouse":["Production Rack","Finished Goods"]};
let DB = JSON.parse(localStorage.getItem('ss_db')||'null') || {users:[],session:null,products:[],stock:{},ledger:[],receipts:[],deliveries:[],seq:1};
if(!DB.receipts) DB.receipts=[];
if(!DB.deliveries) DB.deliveries=[];
if(!DB.transfers) DB.transfers=[]; // Checkpoint 3: Transfers previously had no persisted document array (immediate-validate had none to persist)
if(!DB.adjustments) DB.adjustments=[]; // Checkpoint 3: same — non-destructive, existing ledger/stock/products/users untouched
// Checkpoint 4: migrate the old hard-coded LOC constant into DB.warehouses the first time a
// database (new or pre-checkpoint-4) is loaded. Warehouse/location *names* are carried over
// unchanged, so every existing "SKU@@Location" stock key and every existing document's
// loc/from/to field keeps resolving to the same location — no stock or document data moves.
if(!DB.warehouses) DB.warehouses = Object.keys(DEFAULT_LOC).map(w=>({name:w,locations:DEFAULT_LOC[w].slice()}));
if(!DB.defaultWarehouse || !DB.warehouses.find(w=>w.name===DB.defaultWarehouse)) DB.defaultWarehouse = DB.warehouses.length?DB.warehouses[0].name:null;
let otpCache=null, otpUser=null;
function save(){localStorage.setItem('ss_db',JSON.stringify(DB));}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('toastBox').appendChild(t);setTimeout(()=>t.remove(),2500);}
function ref(p){return p+'-'+String(DB.seq++).padStart(3,'0');}

// ---------- AUTH ----------
function showSignup(){['loginForm','forgotForm'].forEach(i=>document.getElementById(i).classList.add('hidden'));document.getElementById('signupForm').classList.remove('hidden');}
function showLogin(){['signupForm','forgotForm'].forEach(i=>document.getElementById(i).classList.add('hidden'));document.getElementById('loginForm').classList.remove('hidden');}
function showForgot(){['loginForm','signupForm'].forEach(i=>document.getElementById(i).classList.add('hidden'));document.getElementById('forgotForm').classList.remove('hidden');
 document.getElementById('fEmailStep').classList.remove('hidden');document.getElementById('fOtpStep').classList.add('hidden');document.getElementById('fNewPassStep').classList.add('hidden');}
function doSignup(){
 const n=suName.value.trim(),e=suEmail.value.trim().toLowerCase(),p=suPass.value,c=suConf.value;
 suErr.textContent='';
 if(!n||!e||!p) return suErr.textContent='All fields required.';
 if(!/^\S+@\S+\.\S+$/.test(e)) return suErr.textContent='Invalid email.';
 if(p.length<6) return suErr.textContent='Password must be 6+ characters.';
 if(p!==c) return suErr.textContent='Passwords do not match.';
 if(DB.users.find(u=>u.email===e)) return suErr.textContent='Email already registered.';
 DB.users.push({name:n,email:e,pass:p,role:'Inventory Manager'});save();
 toast('Account created — please log in');showLogin();
}
function doLogin(){
 const e=liEmail.value.trim().toLowerCase(),p=liPass.value;liErr.textContent='';
 const u=DB.users.find(x=>x.email===e&&x.pass===p);
 if(!u) return liErr.textContent='Invalid email or password.';
 DB.session=e;save();enterApp();
}
function sendOtp(){
 const e=fEmail.value.trim().toLowerCase();fErr.textContent='';
 const u=DB.users.find(x=>x.email===e);
 if(!u) return fErr.textContent='No account with that email.';
 otpUser=e;otpCache=String(Math.floor(1000+Math.random()*9000));
 otpShow.textContent=otpCache;
 fEmailStep.classList.add('hidden');fOtpStep.classList.remove('hidden');
}
function verifyOtp(){
 if(fOtp.value.trim()!==otpCache) return fErr.textContent='Incorrect OTP.';
 fErr.textContent='';fOtpStep.classList.add('hidden');fNewPassStep.classList.remove('hidden');
}
function resetPass(){
 if(fNewPass.value.length<6) return fErr.textContent='Password must be 6+ characters.';
 const u=DB.users.find(x=>x.email===otpUser);u.pass=fNewPass.value;save();
 toast('Password reset — please log in');showLogin();
}
function logout(){DB.session=null;save();location.reload();}

// ---------- STOCK HELPERS ----------
function stockKey(sku,loc){return sku+'@@'+loc;}
function getStock(sku,loc){return DB.stock[stockKey(sku,loc)]||0;}
function setStock(sku,loc,v){DB.stock[stockKey(sku,loc)]=v;}
function totalStock(sku){let t=0;for(const k in DB.stock) if(k.startsWith(sku+'@@')) t+=DB.stock[k];return t;}
function addLedger(e){e.date=new Date().toLocaleString();e.user=DB.session;DB.ledger.unshift(e);}
function statusOf(p){const t=totalStock(p.sku);if(t<=0) return['Out of Stock','b-bad'];if(t<=p.reorder) return['Low Stock','b-warn'];return['Healthy','b-good'];}
function allLocs(){let a=[];DB.warehouses.forEach(w=>w.locations.forEach(l=>a.push(l)));return a;}
function findWarehouse(name){return DB.warehouses.find(w=>w.name===name);}
// A location is "in use" (unsafe to remove) if any product carries non-zero stock there, or if
// any Receipt/Delivery/Transfer/Adjustment document — of any status, including Done/Canceled —
// references it, so historical documents never end up pointing at a location that no longer
// exists. The Stock Ledger is deliberately NOT checked here: ledger entries store their own
// location text for the audit trail and don't depend on the location still existing, the same
// way a ledger entry keeps showing a product's name/sku after the product itself changes.
function locationInUse(locName){
 for(const k in DB.stock){ if(k.endsWith('@@'+locName) && DB.stock[k]!==0) return true; }
 if(DB.receipts.some(d=>d.loc===locName)) return true;
 if(DB.deliveries.some(d=>d.loc===locName)) return true;
 if(DB.transfers.some(d=>d.from===locName||d.to===locName)) return true;
 if(DB.adjustments.some(d=>d.loc===locName)) return true;
 return false;
}

// ---------- NAV / RENDER ----------
function enterApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');nav('dashboard');}
document.querySelectorAll('#sidebar a[data-p]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();nav(a.dataset.p);}));
function nav(p){document.querySelectorAll('#sidebar a[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===p));
 const fn={dashboard:renderDashboard,products:renderProducts,receipts:renderReceipts,deliveries:renderDeliveries,transfers:renderTransfers,adjustments:renderAdjustments,ledger:renderLedger,settings:renderSettings,profile:renderProfile}[p];
 fn();}

function renderDashboard(){
 const total=DB.products.reduce((s,p)=>s+totalStock(p.sku),0);
 const low=DB.products.filter(p=>statusOf(p)[0]==='Low Stock').length;
 const out=DB.products.filter(p=>statusOf(p)[0]==='Out of Stock').length;
 main.innerHTML=`<h1>Dashboard</h1>
 <div class="grid">
  <div class="card kpi"><h3>Total Units in Stock</h3><div class="v">${total}</div></div>
  <div class="card kpi"><h3>Products</h3><div class="v">${DB.products.length}</div></div>
  <div class="card kpi"><h3>Low Stock Items</h3><div class="v" style="color:var(--warn)">${low}</div></div>
  <div class="card kpi"><h3>Out of Stock Items</h3><div class="v" style="color:var(--bad)">${out}</div></div>
 </div>
 <div class="card"><h3 style="margin-top:0">Recent Activity</h3>
  <table><tr><th>Ref</th><th>Product</th><th>Qty</th><th>Type</th><th>When</th></tr>
  ${DB.ledger.slice(0,8).map(l=>`<tr><td>${l.ref}</td><td>${l.product}</td><td>${l.qty>0?'+':''}${l.qty}</td><td>${l.type}</td><td>${l.date}</td></tr>`).join('')||'<tr><td colspan=5 style="color:var(--sub)">No activity yet</td></tr>'}
  </table></div>`;
}

function renderProducts(){
 main.innerHTML=`<h1>Products</h1>
 <div class="card" style="margin-bottom:16px">
 <div class="row">
  <input id="pName" placeholder="Name">
  <input id="pSku" placeholder="SKU">
  <input id="pCat" placeholder="Category">
  <input id="pUnit" placeholder="Unit (KG, pcs)">
  <input id="pReorder" type="number" placeholder="Reorder Level" style="width:130px">
  <button class="btn" onclick="addProduct()">Add Product</button>
 </div><div class="err" id="pErr"></div></div>
 <div class="card"><table><tr><th>SKU</th><th>Name</th><th>Category</th><th>Total Stock</th><th>Reorder Lvl</th><th>Status</th></tr>
 ${DB.products.map(p=>{const[s,c]=statusOf(p);return `<tr><td>${p.sku}</td><td>${p.name}</td><td>${p.cat}</td><td>${totalStock(p.sku)} ${p.unit}</td><td>${p.reorder}</td><td><span class="badge ${c}">${s}</span></td></tr>`}).join('')||'<tr><td colspan=6 style="color:var(--sub)">No products yet</td></tr>'}
 </table></div>`;
}
function addProduct(){
 const name=pName.value.trim(),sku=pSku.value.trim().toUpperCase(),cat=pCat.value.trim()||'General',unit=pUnit.value.trim()||'pcs',reorder=Number(pReorder.value)||0;
 pErr.textContent='';
 if(!name||!sku) return pErr.textContent='Name and SKU are required.';
 if(DB.products.find(p=>p.sku===sku)) return pErr.textContent='SKU already exists.';
 DB.products.push({name,sku,cat,unit,reorder});save();renderProducts();toast('Product added');
}

function prodOptions(){return DB.products.map(p=>`<option value="${p.sku}">${p.name} (${p.sku})</option>`).join('');}
function locOptions(){
 // Pre-select the default warehouse's first location as a convenience; list order is unchanged.
 const def=findWarehouse(DB.defaultWarehouse);
 const defFirstLoc=def&&def.locations.length?def.locations[0]:null;
 return allLocs().map(l=>`<option ${l===defFirstLoc?'selected':''}>${l}</option>`).join('');
}

// ---------- DOCUMENT LIFECYCLE (Receipts & Deliveries): Draft -> Waiting -> Ready -> Done / Canceled ----------
// Only the 'validate' transition (Ready -> Done) ever touches stock or the ledger.
// docAction() re-checks the document's current status before acting, so a document
// can never apply its stock change twice and can never skip a stage.
function docBadge(status){const c={Draft:'b-gray',Waiting:'b-gray',Ready:'b-warn',Done:'b-good',Canceled:'b-bad'}[status]||'b-gray';return `<span class="badge ${c}">${status}</span>`;}
function docActionsHtml(kind,d){
 if(d.status==='Draft') return `<button class="btn gray" onclick="docAction('${kind}','edit','${d.id}')">Edit</button> <button class="btn" onclick="docAction('${kind}','submit','${d.id}')">Submit</button> <button class="btn red" onclick="docAction('${kind}','cancel','${d.id}')">Cancel</button>`;
 if(d.status==='Waiting') return `<button class="btn" onclick="docAction('${kind}','ready','${d.id}')">Mark Ready</button> <button class="btn red" onclick="docAction('${kind}','cancel','${d.id}')">Cancel</button>`;
 if(d.status==='Ready'){
  // Adjustments can still be edited at Ready so a failed "reason required" validation
  // can be corrected (e.g. reason added) without discarding the document. Receipts/
  // Deliveries/Transfers keep their original Ready-stage actions (Validate, Cancel only).
  const editBtn=kind==='adjustment'?`<button class="btn gray" onclick="docAction('${kind}','edit','${d.id}')">Edit</button> `:'';
  return `${editBtn}<button class="btn" onclick="docAction('${kind}','validate','${d.id}')">Validate</button> <button class="btn red" onclick="docAction('${kind}','cancel','${d.id}')">Cancel</button>`;
 }
 return '<span style="color:var(--sub)">—</span>';
}
function docTable(kind,list){
 if(kind==='transfer'){
  return `<table><tr><th>ID</th><th>Product</th><th>Quantity</th><th>Source</th><th>Destination</th><th>Status</th><th>Actions</th></tr>
  ${list.slice().reverse().map(d=>{const p=DB.products.find(x=>x.sku===d.sku);return `<tr><td>${d.id}</td><td>${p?p.name:d.sku}</td><td>${d.qty}</td><td>${d.from}</td><td>${d.to}</td><td>${docBadge(d.status)}</td><td>${docActionsHtml(kind,d)}</td></tr>`}).join('')||`<tr><td colspan=7 style="color:var(--sub)">No transfers yet</td></tr>`}
  </table>`;
 }
 if(kind==='adjustment'){
  return `<table><tr><th>ID</th><th>Product</th><th>Physical Qty</th><th>Location</th><th>Reason</th><th>Status</th><th>Actions</th></tr>
  ${list.slice().reverse().map(d=>{const p=DB.products.find(x=>x.sku===d.sku);return `<tr><td>${d.id}</td><td>${p?p.name:d.sku}</td><td>${d.phys}</td><td>${d.loc}</td><td>${d.reason||'—'}</td><td>${docBadge(d.status)}</td><td>${docActionsHtml(kind,d)}</td></tr>`}).join('')||`<tr><td colspan=7 style="color:var(--sub)">No adjustments yet</td></tr>`}
  </table>`;
 }
 // Original Receipt/Delivery table — unchanged from checkpoint 2.
 return `<table><tr><th>Ref</th><th>Product</th><th>Qty</th><th>Location</th><th>Status</th><th>Actions</th></tr>
 ${list.slice().reverse().map(d=>{const p=DB.products.find(x=>x.sku===d.sku);return `<tr><td>${d.id}</td><td>${p?p.name:d.sku}</td><td>${d.qty}</td><td>${d.loc}</td><td>${docBadge(d.status)}</td><td>${docActionsHtml(kind,d)}</td></tr>`}).join('')||`<tr><td colspan=6 style="color:var(--sub)">No ${kind}s yet</td></tr>`}
 </table>`;
}
function docList(kind){return kind==='receipt'?DB.receipts:kind==='delivery'?DB.deliveries:kind==='transfer'?DB.transfers:DB.adjustments;}
function renderDocPage(kind){return kind==='receipt'?renderReceipts():kind==='delivery'?renderDeliveries():kind==='transfer'?renderTransfers():renderAdjustments();}
function docAction(kind,action,id){
 const list=docList(kind);
 const d=list.find(x=>x.id===id);
 if(!d) return;
 if(action==='cancel'){
  if(d.status==='Done'||d.status==='Canceled') return; // terminal states can't be re-transitioned
  d.status='Canceled';save();
 } else if(action==='submit'){
  if(d.status!=='Draft') return;
  d.status='Waiting';save();
 } else if(action==='ready'){
  if(d.status!=='Waiting') return;
  d.status='Ready';save();
 } else if(action==='edit'){
  if(kind==='receipt'||kind==='delivery'){
   if(d.status!=='Draft') return; // editing is only allowed before submission, and never touches stock
   const nq=prompt('New quantity:',d.qty);
   if(nq===null) return;
   const nqn=Number(nq);
   if(!nqn||nqn<=0) return toast('Quantity must be greater than 0.');
   d.qty=nqn;save();
  } else if(kind==='transfer'){
   if(d.status!=='Draft') return; // Transfers are editable only while Draft, per spec
   const nsku=prompt('Product SKU:',d.sku); if(nsku===null) return;
   if(!DB.products.find(p=>p.sku===nsku)) return toast('Unknown SKU.');
   const nqty=prompt('Quantity:',d.qty); if(nqty===null) return;
   const nqtyn=Number(nqty); if(!nqtyn||nqtyn<=0) return toast('Quantity must be greater than 0.');
   const nfrom=prompt('Source location:',d.from); if(nfrom===null) return;
   if(!allLocs().includes(nfrom)) return toast('Unknown source location.');
   const nto=prompt('Destination location:',d.to); if(nto===null) return;
   if(!allLocs().includes(nto)) return toast('Unknown destination location.');
   d.sku=nsku;d.qty=nqtyn;d.from=nfrom;d.to=nto;save();
  } else { // adjustment — editable while Draft or Ready; Ready-stage edit exists so a
           // failed "reason required" validation can be corrected without discarding the doc
   if(d.status!=='Draft' && d.status!=='Ready') return;
   const nsku=prompt('Product SKU:',d.sku); if(nsku===null) return;
   if(!DB.products.find(p=>p.sku===nsku)) return toast('Unknown SKU.');
   const nloc=prompt('Location:',d.loc); if(nloc===null) return;
   if(!allLocs().includes(nloc)) return toast('Unknown location.');
   const nphys=prompt('Physical quantity:',d.phys); if(nphys===null) return;
   if(nphys===''||isNaN(Number(nphys))) return toast('Physical quantity is required.');
   const nreason=prompt('Reason (required if physical count differs from system):',d.reason||''); if(nreason===null) return;
   d.sku=nsku;d.loc=nloc;d.phys=Number(nphys);d.reason=nreason.trim();save();
  }
 } else if(action==='validate'){
  if(d.status!=='Ready') return; // guards against double-validation and skipping stages
  const p=DB.products.find(x=>x.sku===d.sku);
  if(kind==='receipt'){
   setStock(d.sku,d.loc,getStock(d.sku,d.loc)+d.qty);
   addLedger({ref:d.id,product:p.name,sku:d.sku,qty:d.qty,type:'Receipt',loc:d.loc,status:'Done'});
   d.status='Done';save();toast('Receipt validated — stock increased');
  } else if(kind==='delivery'){
   const avail=getStock(d.sku,d.loc);
   if(d.qty>avail) return toast(`Insufficient stock. Available: ${avail}, Requested: ${d.qty}`); // status stays Ready, stock untouched
   setStock(d.sku,d.loc,avail-d.qty);
   addLedger({ref:d.id,product:p.name,sku:d.sku,qty:-d.qty,type:'Delivery',loc:d.loc,status:'Done'});
   d.status='Done';save();toast('Delivery validated — stock decreased');
  } else if(kind==='transfer'){
   // Re-check every invariant at Validate time — the only point stock may move.
   if(!p) return toast('Product no longer exists.');
   if(!d.qty||d.qty<=0) return toast('Quantity must be greater than 0.');
   if(!allLocs().includes(d.from)) return toast('Source location no longer exists.');
   if(!allLocs().includes(d.to)) return toast('Destination location no longer exists.');
   if(d.from===d.to) return toast('Source and destination locations must be different.');
   const avail=getStock(d.sku,d.from);
   if(d.qty>avail) return toast(`Insufficient stock. Available: ${avail}, Requested: ${d.qty}`); // status stays Ready, nothing touched
   setStock(d.sku,d.from,avail-d.qty);
   setStock(d.sku,d.to,getStock(d.sku,d.to)+d.qty);
   addLedger({ref:d.id,product:p.name,sku:d.sku,qty:d.qty,type:'Transfer',loc:`${d.from} → ${d.to}`,status:'Done'});
   d.status='Done';save();toast('Transfer validated — total stock unchanged');
  } else { // adjustment
   if(!p) return toast('Product no longer exists.');
   if(d.phys===''||d.phys===undefined||d.phys===null||isNaN(Number(d.phys))) return toast('Physical quantity is required.');
   const sys=getStock(d.sku,d.loc);
   const delta=Number(d.phys)-sys;
   if(delta!==0 && !(d.reason&&d.reason.trim())) return toast('Reason is required for a discrepancy.'); // status stays Ready, nothing touched
   setStock(d.sku,d.loc,Number(d.phys));
   // Existing project convention: always write exactly one Adjustment ledger entry per
   // successful validation, including a zero-delta one (qty:0) — same as the pre-checkpoint-3
   // doAdjust() behavior. No new zero-delta ledger rule is introduced here.
   addLedger({ref:d.id,product:p.name,sku:d.sku,qty:delta,type:'Adjustment',loc:d.loc,status:'Done',reason:d.reason||'—'});
   d.status='Done';save();toast('Adjustment validated');
  }
  renderDocPage(kind);renderDashboard();
  return;
 }
 renderDocPage(kind);
}

  <button class="btn" onclick="createReceipt()">Create Draft</button>
 </div><div class="err" id="rErr"></div></div>
 <div class="card">${docTable('receipt',DB.receipts)}</div>`;
 if(!DB.products.length) main.innerHTML+='<p style="color:var(--sub)">Add a product first.</p>';

 rErr.textContent='';const sku=rProd.value,loc=rLoc.value,qty=Number(rQty.value);

 DB.receipts.push({id:ref('REC'),sku,loc,qty,status:'Draft'});save();
 toast('Receipt created as Draft');renderReceipts();
}

// ---------- DOCUMENT LIFECYCLE (Transfers & Adjustments): Draft -> Waiting -> Ready -> Done / Canceled ----------
// Checkpoint 3: extends the same shared docAction()/docTable()/docBadge() dispatcher used by
// Receipts & Deliveries. Only the 'validate' transition (Ready -> Done) ever touches stock or
// the ledger — creation, submit, mark-ready and edit never do.
function renderTransfers(){
 main.innerHTML=`<h1>Internal Transfers</h1>
 <div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">New Transfer</h3><div class="row">
  <select id="tProd">${prodOptions()}</select>
  <select id="tFrom">${locOptions()}</select>
  <select id="tTo">${locOptions()}</select>
  <input id="tQty" type="number" placeholder="Quantity" style="width:120px">
  <button class="btn" onclick="createTransfer()">Create Draft</button>
 </div><div class="err" id="tErr"></div></div>
 <div class="card">${docTable('transfer',DB.transfers)}</div>`;
}
function createTransfer(){
 tErr.textContent='';const sku=tProd.value,from=tFrom.value,to=tTo.value,qty=Number(tQty.value);
 if(!sku) return tErr.textContent='Product required.';
 if(!qty||qty<=0) return tErr.textContent='Quantity must be greater than 0.';
 if(from===to) return tErr.textContent='Source and destination locations must be different.';
 // Insufficient stock is intentionally NOT checked here — only at Validate (Ready -> Done),
 // per the controlled document lifecycle. Creating a Draft never touches stock or the ledger.
 DB.transfers.push({id:ref('TRF'),sku,qty,from,to,status:'Draft'});save();
 toast('Transfer created as Draft');renderTransfers();
}

function renderAdjustments(){
 main.innerHTML=`<h1>Inventory Adjustments</h1>
 <div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">New Adjustment</h3><div class="row">
  <select id="aProd">${prodOptions()}</select>
  <select id="aLoc">${locOptions()}</select>
  <input id="aPhys" type="number" placeholder="Physical Count" style="width:140px">
  <input id="aReason" placeholder="Reason (required if discrepancy)">
  <button class="btn" onclick="createAdjustment()">Create Draft</button>
 </div><div class="err" id="aErr"></div></div>
 <div class="card">${docTable('adjustment',DB.adjustments)}</div>`;
}
function createAdjustment(){
 aErr.textContent='';const sku=aProd.value,loc=aLoc.value,physRaw=aPhys.value,reason=aReason.value.trim();
 if(!sku) return aErr.textContent='Product required.';
 if(physRaw==='') return aErr.textContent='Physical quantity required.';
 if(isNaN(Number(physRaw))) return aErr.textContent='Physical quantity must be a number.';
 // The reason-required-on-discrepancy rule is enforced at Validate, not at Draft creation,
 // so a discrepancy can be recorded as a Draft even before its reason is known.
 DB.adjustments.push({id:ref('ADJ'),sku,loc,phys:Number(physRaw),reason,status:'Draft'});save();
 toast('Adjustment created as Draft');renderAdjustments();
}

function renderLedger(){
 main.innerHTML=`<h1>Stock Ledger</h1><div class="card"><table>
 <tr><th>Ref</th><th>Product</th><th>Qty Change</th><th>Type</th><th>Location</th><th>Reason</th><th>User</th><th>Date</th></tr>
 ${DB.ledger.map(l=>`<tr><td>${l.ref}</td><td>${l.product}</td><td>${l.qty>0?'+':''}${l.qty}</td><td><span class="badge b-gray">${l.type}</span></td><td>${l.loc}</td><td>${l.reason||'—'}</td><td>${l.user}</td><td>${l.date}</td></tr>`).join('')||'<tr><td colspan=8 style="color:var(--sub)">No transactions yet</td></tr>'}
 </table></div>`;
}
// ---------- SETTINGS (Checkpoint 4: Warehouse & Location Management) ----------
// DB.warehouses = [{name, locations:[name,...]}], DB.defaultWarehouse = a warehouse name.
// Adding/renaming/removing here never touches the document lifecycle (docList/renderDocPage/
// docAction/docTable/docBadge are untouched) — Settings only edits DB.warehouses/DB.defaultWarehouse
// and, for a location rename, cascades the same string change into DB.stock keys and the four
// document arrays so nothing is left pointing at a name that no longer exists.
function renderSettings(){
 let html=`<h1>Settings</h1>
 <div class="card" style="margin-bottom:16px">
  <h3 style="margin-top:0">Default Warehouse</h3>
  <p style="color:var(--sub);font-size:13px;margin-top:0">Used to pre-select a location when creating a new document.</p>
  <div class="row">
   <select id="defWhSel" onchange="setDefaultWarehouse(this.value)">
    ${DB.warehouses.map(w=>`<option value="${w.name}" ${w.name===DB.defaultWarehouse?'selected':''}>${w.name}</option>`).join('')}
   </select>
  </div>
 </div>
 <div class="card" style="margin-bottom:16px">
  <h3 style="margin-top:0">Add Warehouse</h3>
  <div class="row"><input id="newWhName" placeholder="Warehouse name"><button class="btn" onclick="addWarehouse()">Add Warehouse</button></div>
  <div class="err" id="settingsErr"></div>
 </div>`;
 DB.warehouses.forEach((w,wi)=>{
  html+=`<div class="card" style="margin-bottom:16px">
   <div class="row" style="justify-content:space-between;align-items:center">
    <h3 style="margin:0">${w.name}${w.name===DB.defaultWarehouse?' <span class="badge b-good">Default</span>':''}</h3>
    <div class="row" style="margin:0">
     <button class="btn gray" onclick="renameWarehouse('${w.name}')">Rename</button>
     <button class="btn red" onclick="removeWarehouse('${w.name}')">Remove Warehouse</button>
    </div>
   </div>
   <table><tr><th>Location</th><th>Actions</th></tr>
   ${w.locations.map(l=>`<tr><td>${l}</td><td>
     <button class="btn gray" onclick="renameLocation('${w.name}','${l}')">Rename</button>
     <button class="btn red" onclick="removeLocation('${w.name}','${l}')">Remove</button>
    </td></tr>`).join('')||'<tr><td colspan=2 style="color:var(--sub)">No locations yet</td></tr>'}
   </table>
   <div class="row" style="margin-top:10px">
    <input id="newLocName_${wi}" placeholder="New location name">
    <button class="btn" onclick="addLocation('${w.name}',${wi})">Add Location</button>
   </div>
  </div>`;
 });
 main.innerHTML=html;
}
function setDefaultWarehouse(name){
 if(!findWarehouse(name)) return;
 DB.defaultWarehouse=name;save();toast('Default warehouse updated');renderSettings();
}
function addWarehouse(){
 const name=(document.getElementById('newWhName').value||'').trim();
 const err=document.getElementById('settingsErr');err.textContent='';
 if(!name) return err.textContent='Warehouse name is required.';
 if(DB.warehouses.some(w=>w.name.toLowerCase()===name.toLowerCase())) return err.textContent='A warehouse with that name already exists.';
 DB.warehouses.push({name,locations:[]});save();toast('Warehouse added');renderSettings();
}
function renameWarehouse(oldName){
 const nn=prompt('New warehouse name:',oldName); if(nn===null) return;
 const name=nn.trim();
 if(!name) return toast('Warehouse name is required.');
 if(name!==oldName && DB.warehouses.some(w=>w.name.toLowerCase()===name.toLowerCase())) return toast('A warehouse with that name already exists.');
 const w=findWarehouse(oldName); if(!w) return;
 w.name=name;
 if(DB.defaultWarehouse===oldName) DB.defaultWarehouse=name; // keep the default pointer valid
 save();toast('Warehouse renamed');renderSettings();
}
function removeWarehouse(name){
 const w=findWarehouse(name); if(!w) return;
 if(DB.warehouses.length<=1) return toast('At least one warehouse must remain.');
 // Safety: a warehouse can only be removed once it has no locations left — removing its
 // locations individually (below) already refuses if any of them is still referenced by
 // stock or a document, so an empty warehouse is always safe to remove.
 if(w.locations.length>0) return toast('Remove or move all of this warehouse\'s locations first.');
 if(!confirm(`Remove warehouse "${name}"? This cannot be undone.`)) return;
 DB.warehouses=DB.warehouses.filter(x=>x.name!==name);
 if(DB.defaultWarehouse===name) DB.defaultWarehouse=DB.warehouses[0].name;
 save();toast('Warehouse removed');renderSettings();
}
function addLocation(whName,wi){
 const el=document.getElementById('newLocName_'+wi);
 const name=(el.value||'').trim();
 if(!name) return toast('Location name is required.');
 // Location names are unique across ALL warehouses, not just within one — stockKey() only
 // encodes "SKU@@Location", not the warehouse, so two locations sharing a name would collide.
 if(allLocs().some(l=>l.toLowerCase()===name.toLowerCase())) return toast('A location with that name already exists (location names must be unique across all warehouses).');
 const w=findWarehouse(whName); if(!w) return;
 w.locations.push(name);save();toast('Location added');renderSettings();
}
function renameLocation(whName,oldLoc){
 const nn=prompt('New location name:',oldLoc); if(nn===null) return;
 const name=nn.trim();
 if(!name) return toast('Location name is required.');
 if(name!==oldLoc && allLocs().some(l=>l.toLowerCase()===name.toLowerCase())) return toast('A location with that name already exists.');
 const w=findWarehouse(whName); if(!w) return;
 const idx=w.locations.indexOf(oldLoc); if(idx===-1) return;
 // Rename is "safe" exactly when the new name doesn't collide with an existing one (checked
 // above). Nothing is orphaned: cascade the same string change into stock keys and every
 // document field that stores this location name, so existing data keeps resolving correctly.
 for(const k in DB.stock){
  if(k.endsWith('@@'+oldLoc)){
   const sku=k.slice(0,k.length-('@@'+oldLoc).length);
   if(sku+'@@'+oldLoc===k){ DB.stock[stockKey(sku,name)]=DB.stock[k]; delete DB.stock[k]; }
  }
 }
 DB.receipts.forEach(d=>{if(d.loc===oldLoc) d.loc=name;});
 DB.deliveries.forEach(d=>{if(d.loc===oldLoc) d.loc=name;});
 DB.transfers.forEach(d=>{if(d.from===oldLoc) d.from=name; if(d.to===oldLoc) d.to=name;});
 DB.adjustments.forEach(d=>{if(d.loc===oldLoc) d.loc=name;});
 DB.ledger.forEach(l=>{
  if(l.loc===oldLoc){ l.loc=name; }
  else if(l.loc && l.loc.indexOf(' → ')!==-1){
   const parts=l.loc.split(' → ');
   if(parts[0]===oldLoc||parts[1]===oldLoc) l.loc=`${parts[0]===oldLoc?name:parts[0]} → ${parts[1]===oldLoc?name:parts[1]}`;
  }
 });
 w.locations[idx]=name;
 save();toast('Location renamed');renderSettings();
}
function removeLocation(whName,locName){
 if(locationInUse(locName)) return toast('Cannot remove: this location is referenced by existing stock or a document.');
 if(!confirm(`Remove location "${locName}"? This cannot be undone.`)) return;
 const w=findWarehouse(whName); if(!w) return;
 w.locations=w.locations.filter(l=>l!==locName);
 save();toast('Location removed');renderSettings();
}
